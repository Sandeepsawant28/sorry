<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A note for you</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1b4b;--soft:#6b4e9b;--pink:#e8458b;--pink2:#c73a9e;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:16px/1.5 "Fraunces",Georgia,serif;color:var(--ink);background:radial-gradient(circle at 50% 30%,#4a2a6e,#1a0f2c);display:grid;place-items:center;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:#f7ecfd}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.hand{font-family:"Caveat",cursive;font-weight:500}

.story{position:relative;width:100%;height:100%;max-width:440px;overflow:hidden;user-select:none;touch-action:pan-y;cursor:pointer;container-type:size;
  background:linear-gradient(180deg,#f7ecfd,#ead7f8)}
@media(min-width:600px){.story{height:min(calc(100% - 40px),860px);border-radius:40px;border:9px solid #fff2;box-shadow:0 30px 80px rgba(0,0,0,.5)}}

.hearts{position:absolute;inset:0;pointer-events:none}
.hearts span{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.5}100%{transform:translateY(-115cqh) translateX(26px);opacity:0}}

.bars{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:5}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(107,78,155,.22);transition:background .3s}.bars i.d{background:var(--pink)}

.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12% 9% 12%;gap:.5em;animation:in .45s ease-out}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sticker{font-size:clamp(70px,24cqw,120px);line-height:1;filter:drop-shadow(0 8px 14px rgba(120,60,160,.3));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
h2{font-size:clamp(24px,9cqw,42px);line-height:1.15;font-weight:800}
.slide .hand{font-size:clamp(22px,7.4cqw,36px);color:var(--soft);line-height:1.25;max-width:20ch}
.tip{font-size:14px;color:var(--soft)}

.letter{background:#fffdfb;border-radius:20px;padding:8% 9%;box-shadow:0 14px 34px rgba(120,60,160,.2);text-align:left;width:100%}
.letter h2{font-size:clamp(20px,6.5cqw,28px)}
.letter .hand{font-size:clamp(21px,6.8cqw,32px);max-width:none;color:#4a3478;margin-top:.3em}
.letter .sig{text-align:right}

.polaroid{background:#fff;padding:10px 10px 32px;border-radius:6px;box-shadow:0 14px 30px rgba(0,0,0,.2);transform:rotate(-3deg);width:66%;position:relative;margin:.3em 0}
.polaroid::before{content:"";position:absolute;inset:0;background:#fff;border-radius:6px;transform:rotate(7deg);z-index:-1;box-shadow:0 6px 14px rgba(0,0,0,.12)}
.ph{display:grid;place-items:center;aspect-ratio:1;border-radius:3px;background:#f2dff7 center/cover;font-size:15px;color:var(--soft);text-align:center;padding:8px}
.gal{display:grid;grid-template-columns:1fr;gap:10px;width:70%;justify-items:center}
.gal.m{grid-template-columns:1fr 1fr;width:84%}
.gal .polaroid{width:100%;margin:0;padding:6px 6px 18px}
.gal .polaroid::before{display:none}
.gal .polaroid:nth-child(even){transform:rotate(3deg)}

.env{position:relative;width:60%;aspect-ratio:1.4;background:#f5b800;border-radius:10px;box-shadow:0 14px 28px rgba(0,0,0,.18)}
.env .flap{position:absolute;left:0;right:0;top:0;height:55%;background:#ffd84d;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s;z-index:3;border-radius:10px 10px 0 0}
.env .note{position:absolute;left:9%;right:9%;top:8%;height:75%;background:#fff;border-radius:6px;transition:transform .7s .35s;z-index:1}
.env .front{position:absolute;inset:0;background:#ffd84d;clip-path:polygon(0 100%,0 38%,50% 68%,100% 38%,100% 100%);border-radius:10px;z-index:2}
.env.open .flap{transform:rotateX(180deg);z-index:0}.env.open .note{transform:translateY(-52%)}

.dots{position:absolute;left:0;right:0;bottom:4%;display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:9px;background:#d5bdea;transition:.3s}.dots i.a{width:22px;background:var(--pink)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function gallery(c){
  const p=c.photos||[],n=p.length;
  const imgs=p.map(u=>`<div class="polaroid"><div class="ph" style="background-image:url('${u}')"></div></div>`).join("");
  return `<div class="gal${n>1?" m":""}">${imgs}</div>`;
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const SL=[
 c=>`<div class="env" id="env"><div class="flap"></div><div class="note"></div><div class="front"></div></div><h2 style="margin-top:.6em">A note for ${esc(c.to)}</h2><p class="tip">Tap to open</p>`,
 c=>`<div class="sticker">🧸</div><h2>${esc(c.to)}… ${esc(c.opening)} 🥺</h2><p class="hand">I just…</p>`,
 c=>`<div class="sticker">🐻‍❄️</div><h2>I know I hurt you</h2><p class="hand">${esc(c.message1)}</p>`,
 c=>`<div class="sticker">🐱</div><h2>You mean everything</h2><p class="hand">${esc(c.message2)}</p>`,
 c=>`<div class="letter"><h2>Hi ${esc(c.to)} 💙</h2><p class="hand">${esc(c.letter)}</p><p class="hand sig">— ${esc(c.from)} 💙</p></div><div class="sticker" style="font-size:64px">🐈</div>`,
 c=>`<h2>You have no idea what this means 💙</h2>${gallery(c)}<p class="hand" style="font-size:clamp(20px,6.4cqw,30px)">${esc(c.closing)}</p>`,
 c=>`<div class="sticker">💌</div><h2>Made with care, just for you</h2><p class="hand">— ${esc(c.from)}</p>`
];
const HEARTS=["💙","💗","💜","✨","🌸"];

const el=document.getElementById("story");
el.innerHTML=`<div class="hearts"></div><div class="bars"></div><div class="slide"></div><div class="dots"></div>`;
const hs=el.querySelector(".hearts"),sl=el.querySelector(".slide"),dots=el.querySelector(".dots"),bars=el.querySelector(".bars");
for(let k=0;k<12;k++){const s=document.createElement("span");s.textContent=HEARTS[k%5];
  s.style.cssText=`left:${Math.random()*92}%;font-size:${12+Math.random()*16}px;animation-duration:${7+Math.random()*7}s;animation-delay:${-Math.random()*12}s`;hs.appendChild(s)}

let i=0,opened=false;
function draw(anim=true){
  sl.innerHTML=SL[i](CARD);
  if(anim){sl.style.animation="none";sl.offsetWidth;sl.style.animation=""}
  dots.innerHTML=SL.map((_,k)=>`<i class="${k===i?"a":""}"></i>`).join("");
  bars.innerHTML=SL.map((_,k)=>`<i class="${k<=i?"d":""}"></i>`).join("");
}
function go(d){
  if(i===0&&d>0&&!opened){opened=true;sl.querySelector("#env").classList.add("open");setTimeout(()=>{i=1;draw()},1000);return}
  const j=Math.max(0,Math.min(SL.length-1,i+d));if(j!==i){i=j;draw()}
}
let x0=null;
el.addEventListener("pointerdown",e=>{x0=e.clientX});
el.addEventListener("pointerup",e=>{
  if(x0===null||e.target.closest("a,button,label,input"))return;
  const dx=e.clientX-x0;x0=null;
  if(Math.abs(dx)>45)return go(dx<0?1:-1);
  const r=el.getBoundingClientRect();go(e.clientX-r.left<r.width/3?-1:1);
});
el.tabIndex=0;
addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" ")go(1);if(e.key==="ArrowLeft")go(-1)});
draw();
</script>
